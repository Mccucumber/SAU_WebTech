<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <a class="back-link" href="../Hakkımda/Hakkımda.html">Siteye dön</a>
            <h1>Giriş Yap</h1>
            <p class="login-info">Kullanıcı adı öğrenci maili, şifre öğrenci numarasıdır.</p>

            <div id="loginError" class="login-message error" aria-live="polite"></div>

            <form id="loginForm" action="login.php" method="post" novalidate>
                <label for="email">Öğrenci Maili</label>
                <input id="email" type="email" name="email" placeholder="b241210374@sakarya.edu.tr">

                <label for="password">Şifre</label>
                <input id="password" type="password" name="password" placeholder="b241210374">

                <button type="submit">Giriş Yap</button>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("loginError");
        const params = new URLSearchParams(window.location.search);

        if (params.get("error") === "1") {
            errorBox.textContent = "Bilgiler hatalı veya eksik. Lütfen tekrar deneyin.";
        }

        form.addEventListener("submit", function (event) {
            const email = form.elements["email"].value.trim();
            const password = form.elements["password"].value.trim();
            const sakaryaMailPattern = /^[a-z]\d{9,10}@sakarya\.edu\.tr$/i;
            const errors = [];

            if (!email) errors.push("Mail alanı boş bırakılamaz.");
            if (email && !sakaryaMailPattern.test(email)) errors.push("Mail, öğrenci numarası formatında ve sakarya.edu.tr uzantılı olmalıdır.");
            if (!password) errors.push("Şifre alanı boş bırakılamaz.");
            if (email && sakaryaMailPattern.test(email) && password && password !== email.split("@")[0]) {
                errors.push("Şifre, mail adresindeki öğrenci numarasıyla aynı olmalıdır.");
            }

            if (errors.length) {
                event.preventDefault();
                errorBox.innerHTML = errors.join("<br>");
            }
        });
    </script>
</body>
</html>
